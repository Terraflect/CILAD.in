<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects 404 paths to index.html with appropriate hash route
      (function() {
        var pathSegmentsToKeep = 1; // repository name on GitHub Pages
        var l = window.location;
        var pathname = l.pathname;
        var pathSegments = pathname.split('/').filter(Boolean);
        var repoName = pathSegments.length > 0 ? '/' + pathSegments[0] : '';
        var restOfPath = pathSegments.slice(pathSegmentsToKeep).join('/');
        var search = l.search ? l.search : '';
        var hash = l.hash ? l.hash : (restOfPath ? '#/' + restOfPath : '');
        
        var destination = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + repoName + '/' + search + hash;
        window.location.replace(destination);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to CILAD...</p>
  </body>
</html>
